<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlex</title>
</head>
<body>
    <!-- Header start -->
    <header>
        <h2 class="logo">EduFlex</h2>
        <nav>
            <li><a href="#">Course</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">Tutor</a></li>
            <li><a href="#">Admission</a></li>
            <li><a href="#">About</a></li>
        </nav>
        <button class="contact-btn">Contact</button>
    </header>
    <!-- Header ends here -->

    <!-- Main starts -->
     <main>
        <article>
            <div class="description">
                <h2>A new way to learn & get knowledge</h2>
                <p>EduFlex is here for you with various courses & materials from skilled tutors all around the world</p>
                <div class="btn">
                    <button type="button" class="join-btn">Join the Classes</button>
                    <button type="button" class="learn-btn">Learn more</button>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <h3>15,2K</h3>
                    <p>Active Students</p>
                </div>
                <div class="stat">
                    <h3>4,5K</h3>
                    <p>Tutors</p>
                </div>
                <div class="stat">
                    <img src="/assets/Audi-Logo-PNG-File.png" alt="stat-logo">
                    <p>Resources</p>
                </div>
            </div>
        </article>
        <section>
            <img src="./assets/student-bg-rm.jpg" alt="">
        </section>
     </main>
     <!-- Main ends -->


</body>
</html>
